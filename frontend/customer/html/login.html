<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BRB Studios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:ital,wght@0,400;0,500;0,700;1,400&display=swap">

  <link rel="stylesheet" href="../css/customer-base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page auth-page--login">

  <main class="login">
    <section class="login__showcase">
      <img class="login__logo" src="../CustomerImages/brb-logo.png" alt="BRB Studios">

      <div class="login__gallery" role="img" aria-label="BRB Studios storefront">
        <img class="login__photo" src="../CustomerImages/storefront-left.jpg" alt="">
        <img class="login__photo" src="../CustomerImages/storefront-center.jpg" alt="">
        <img class="login__photo" src="../CustomerImages/storefront-right.jpg" alt="">
      </div>
    </section>

    <section class="login__panel">
      <h1 class="login__title">Welcome Back!</h1>
      <p class="login__subtitle">Sign in to manage your bookings</p>

      <p class="form-alert form-alert--success login__alert" id="formNotice" role="status" hidden></p>
      <p class="form-alert form-alert--error login__alert" id="formError" role="alert" hidden></p>

      <form class="auth-form login__form" id="loginForm" novalidate>
        <div class="form-field">
          <label class="form-field__label" for="email">Email Address</label>
          <input class="form-field__input" id="email" name="email" type="email"
                 placeholder="juandelacruz67@gmail.com" autocomplete="email" required>
          <p class="form-field__error" hidden></p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="password">Password</label>
          <div class="password-input">
            <input class="form-field__input" id="password" name="password" type="password"
                   placeholder="***********" autocomplete="current-password" required>
            <button class="password-input__toggle" type="button" aria-label="Show password" aria-pressed="false">
              <span class="password-input__icon" aria-hidden="true"></span>
            </button>
          </div>
          <p class="form-field__error" hidden></p>
        </div>

        <button class="btn-primary btn-primary--block login__submit" type="submit">Login</button>
      </form>

      <p class="login__register">
        No account yet? <a class="auth-link" href="register.html">Register</a>
      </p>

      <a class="login__back" href="home.html">back to home</a>
    </section>
  </main>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
