<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | BRB Studios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:ital,wght@0,400;0,500;0,700;1,400&display=swap">

  <link rel="stylesheet" href="../css/customer-base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/account-layout.css">
  <link rel="stylesheet" href="../css/settings.css">
</head>
<body class="account-page">

  <header class="site-header account-site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="home.html">
        <img class="site-header__logo" src="../CustomerImages/brb-logo.png" alt="BRB Studios">
      </a>

      <nav class="site-header__nav" aria-label="Main">
        <a class="site-header__link" href="home.html">Home</a>
        <a class="site-header__link" href="home.html#about">About</a>
        <a class="site-header__link" href="home.html#contact">Contact</a>
        <a class="site-header__link site-header__link--accent" href="book-service.html">My Profile</a>
      </nav>

    </div>
  </header>

  <div class="account">
    <aside class="account__sidebar" id="accountSidebar">
      <img class="account__logo" src="../CustomerImages/brb-logo.png" alt="BRB Studios">
      <p class="account__eyebrow">Account</p>
      <p class="account__name" id="accountName"></p>

      <nav class="account__menu" aria-label="Account">
        <a class="account__link" href="book-service.html">Book a service</a>
        <a class="account__link" href="my-bookings.html">My bookings</a>
        <a class="account__link account__link--current" href="settings.html" aria-current="page">Settings</a>
      </nav>

      <button class="account__logout" id="logoutButton" type="button">
        <span class="account__logout-icon" aria-hidden="true"></span>
        Logout
      </button>
    </aside>

    <button class="account-sidebar-toggle" id="accountSidebarToggle" type="button"
            aria-controls="accountSidebar" aria-expanded="true" aria-label="Hide customer navigation">
      <span class="account-sidebar-toggle__icon" aria-hidden="true">
        <span class="account-sidebar-toggle__line"></span>
        <span class="account-sidebar-toggle__line"></span>
        <span class="account-sidebar-toggle__line"></span>
      </span>
    </button>

    <main class="account__main settings">
      <h1 class="settings__display-name" id="displayName"></h1>

      <p class="form-alert form-alert--success settings__alert" id="profileSuccess" role="status" hidden></p>
      <p class="form-alert form-alert--error settings__alert" id="profileError" role="alert" hidden></p>

      <form class="settings__form" id="profileForm" novalidate>
        <div class="settings__row">
          <div class="form-field">
            <label class="form-field__label" for="firstName">First Name</label>
            <input class="form-field__input" id="firstName" name="firstName" type="text"
                   autocomplete="given-name" maxlength="50" required>
            <p class="form-field__error" hidden></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="lastName">Last Name</label>
            <input class="form-field__input" id="lastName" name="lastName" type="text"
                   autocomplete="family-name" maxlength="50" required>
            <p class="form-field__error" hidden></p>
          </div>
        </div>

        <div class="settings__row">
          <div class="form-field">
            <label class="form-field__label" for="email">Email Address</label>
            <input class="form-field__input" id="email" name="email" type="email"
                   autocomplete="email" maxlength="100" required>
            <p class="form-field__error" hidden></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="contactNumber">Contact Number</label>
            <input class="form-field__input" id="contactNumber" name="contactNumber" type="tel"
                   autocomplete="tel" inputmode="numeric" maxlength="11" required>
            <p class="form-field__error" hidden></p>
          </div>
        </div>

        <div class="settings__footer">
          <button class="btn-primary" id="saveProfile" type="submit">Save Changes</button>
        </div>
      </form>

      <section class="change-password" aria-labelledby="passwordHeading">
        <h2 class="change-password__title" id="passwordHeading">Change Password</h2>

        <p class="form-alert form-alert--success" id="passwordSuccess" role="status" hidden></p>
        <p class="form-alert form-alert--error" id="passwordError" role="alert" hidden></p>

        <form class="change-password__form" id="passwordForm" novalidate>
          <div class="change-password__row">
            <div class="form-field">
              <label class="form-field__label" for="currentPassword">Current</label>
              <input class="form-field__input" id="currentPassword" name="currentPassword" type="password"
                     placeholder="***********" autocomplete="current-password" maxlength="72" required>
              <p class="form-field__error" hidden></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="newPassword">New</label>
              <input class="form-field__input" id="newPassword" name="newPassword" type="password"
                     placeholder="***********" autocomplete="new-password" maxlength="72" required>
              <p class="form-field__error" hidden></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="confirmPassword">Confirm</label>
              <input class="form-field__input" id="confirmPassword" name="confirmPassword" type="password"
                     placeholder="***********" autocomplete="new-password" maxlength="72" required>
              <p class="form-field__error" hidden></p>
            </div>
          </div>

          <button class="btn-primary" id="updatePassword" type="submit">Update Password</button>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="../js/settings.js"></script>
</body>
</html>
